# Render blueprint: the relay (server/) as one free web service, reachable as wss://<name>.onrender.com.
# Deploy: Render dashboard → New → Blueprint → this repository. Render sets PORT; the relay listens on it.
# Then open the game with ?ws=wss://<name>.onrender.com (and &room=CODE to join a friend's room).
services:
  - type: web
    name: gamerfleet-relay
    runtime: docker
    plan: free
    # Closest Render region to central India (about 60-80 ms from Nagpur); other choices: frankfurt, oregon, ohio, virginia.
    region: singapore
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render's proxy appends the visitor's address as the LAST X-Forwarded-For entry (admin rate limits, audit hash).
      # Keep this only behind such a proxy: without one, a client could pick that entry itself.
      - key: TRUST_PROXY
        value: "1"
      # Secrets and owner settings: set the values in the Render dashboard (Environment), never in this file.
      # ADMIN_KEY: the owner's admin passphrase, at least 24 characters (admin stays off without it).
      - key: ADMIN_KEY
        sync: false
      # ADMIN_EMAILS: comma-separated Google accounts allowed into the admin console (with GOOGLE_CLIENT_ID: two-factor).
      - key: ADMIN_EMAILS
        sync: false
      # GOOGLE_CLIENT_ID: the game's Google OAuth client id (public); players' sign-in tokens must be issued to it.
      - key: GOOGLE_CLIENT_ID
        sync: false
